services:
  postgres:
    image: postgres:16-alpine
    container_name: sigak-postgres
    environment:
      POSTGRES_DB: sigak
      POSTGRES_USER: sigak
      POSTGRES_PASSWORD: sigak
    ports:
      - "5432:5432"
    volumes:
      - sigak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigak -d sigak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sigak-postgres-data:
