services:
  postgres:
    image: postgres:16-alpine
    container_name: sigak-postgres
    environment:
      POSTGRES_DB: sigak
      POSTGRES_USER: sigak
      POSTGRES_PASSWORD: sigak
    ports:
      - "5432:5432"
    volumes:
      - sigak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigak -d sigak"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: sigak-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - sigak-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sigak-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - sigak-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26-community
    container_name: sigak-neo4j
    environment:
      NEO4J_AUTH: neo4j/sigak-neo4j-password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - sigak-neo4j-data:/data
      - sigak-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sigak-neo4j-password 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12

  ai:
    build:
      context: ../ai
      dockerfile: Dockerfile
    image: sigak-ai:local
    container_name: sigak-ai
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  db-schema:
    image: schemaspy/schemaspy:6.2.4
    platform: linux/amd64
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "-t"
      - "pgsql"
      - "-host"
      - "postgres"
      - "-port"
      - "5432"
      - "-db"
      - "sigak"
      - "-u"
      - "sigak"
      - "-p"
      - "sigak"
      - "-s"
      - "public"
    volumes:
      - ../outputs/db-schema:/output

volumes:
  sigak-postgres-data:
  sigak-elasticsearch-data:
  sigak-qdrant-data:
  sigak-neo4j-data:
  sigak-neo4j-logs:
