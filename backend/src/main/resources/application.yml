spring:
  datasource:
    url: ${SIGAK_DB_URL:jdbc:postgresql://localhost:5432/sigak}
    username: ${SIGAK_DB_USERNAME:sigak}
    password: ${SIGAK_DB_PASSWORD:sigak}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

sigak:
  ai-server:
    url: ${SIGAK_AI_SERVER_URL:http://localhost:8000}
  collection:
    http:
      connect-timeout: ${SIGAK_COLLECTION_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${SIGAK_COLLECTION_HTTP_READ_TIMEOUT:10s}
  internal:
    search-evaluation:
      enabled: ${SIGAK_INTERNAL_SEARCH_EVALUATION_ENABLED:false}
  search:
    mode: ${SIGAK_SEARCH_MODE:hybrid}
    hybrid:
      rrf-k: ${SIGAK_HYBRID_RRF_K:60}
      keyword-weight: ${SIGAK_HYBRID_KEYWORD_WEIGHT:1.0}
      vector-weight: ${SIGAK_HYBRID_VECTOR_WEIGHT:1.0}
      keyword-candidate-limit: ${SIGAK_HYBRID_KEYWORD_CANDIDATE_LIMIT:20}
      vector-candidate-limit: ${SIGAK_HYBRID_VECTOR_CANDIDATE_LIMIT:20}
      result-limit: ${SIGAK_HYBRID_RESULT_LIMIT:20}
    elasticsearch:
      url: ${SIGAK_ELASTICSEARCH_URL:http://localhost:9200}
      article-index-name: ${SIGAK_ELASTICSEARCH_ARTICLE_INDEX:sigak-articles-v1}
    qdrant:
      url: ${SIGAK_QDRANT_URL:http://localhost:6333}
      article-collection-name: ${SIGAK_QDRANT_ARTICLE_COLLECTION:sigak-article-vectors-minilm-v1}
      distance: ${SIGAK_QDRANT_DISTANCE:Cosine}
      default-limit: ${SIGAK_QDRANT_DEFAULT_LIMIT:10}
      max-limit: ${SIGAK_QDRANT_MAX_LIMIT:50}
    neo4j:
      uri: ${SIGAK_NEO4J_URI:bolt://localhost:7687}
      username: ${SIGAK_NEO4J_USERNAME:neo4j}
      password: ${SIGAK_NEO4J_PASSWORD:sigak-neo4j-password}
