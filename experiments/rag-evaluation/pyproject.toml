[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigak-rag-evaluation"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "httpx==0.28.1",
  "kiwipiepy==0.23.2",
  "numpy==2.4.6",
  "pydantic==2.13.4",
  "tiktoken==0.13.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
